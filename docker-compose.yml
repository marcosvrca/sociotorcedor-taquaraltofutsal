services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: socio
      POSTGRES_PASSWORD: socio
      POSTGRES_DB: sociotorcedor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socio -d sociotorcedor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
